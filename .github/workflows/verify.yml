name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POKER_SOLVER_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Unit and integration tests
        # Exact runout and simulation suites compete for the hosted runner's CPU.
        run: npm test -- --maxWorkers=1
      - name: Production build
        run: npm run build
      - name: Install browser and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser tests
        run: npm run test:browser
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
